# SPDX-License-Identifier: Apache-2.0
#
# Builds everything and runs the test suite. `bazelisk test //...` builds
# every target in the pattern, not only the tests and their
# dependencies, because `--build_tests_only` is false by default, so a
# separate build job would repeat this one. The build stays a step of
# its own so that "does not build" and "does not pass" are different
# lines in the step list; the second invocation costs an analysis pass
# and no actions, because the first one filled the cache.
#
# It needs the `vivado` runner: that host holds the AMD installer
# archive and the shared Vivado install cache that MODULE.bazel points
# at. The `vivado` label runs jobs directly on the host, and that host
# has no node, so no JavaScript action can run here. That is why the
# checkout is done with plain git rather than with actions/checkout.
name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Once a week, so a build that only rots on the shelf still gets
    # caught.
    - cron: '47 4 * * 1'

jobs:
  test:
    runs-on: vivado
    steps:
      - name: Checkout
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PAGER: cat
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
              fetch -q --depth=1 origin "+${REF}:refs/ci/head"
          git checkout -q refs/ci/head
          # --no-pager matters: the runner leaves git free to start a pager,
          # which then waits on input forever and hangs the whole job.
          git --no-pager log --oneline -1

      - name: Show the toolchain
        run: |
          set -euo pipefail
          bazelisk --version
          cat .bazelversion

      - name: Build everything
        run: bazelisk build //...

      - name: Run the tests
        run: bazelisk test --test_output=errors //...

      - name: Check that the simulation produced a waveform database
        run: |
          set -euo pipefail
          bazelisk build //hdl/counter:sim
          wdb="$(bazelisk info bazel-bin)/hdl/counter/sim.wdb"
          test -s "${wdb}" || { echo "missing or empty: ${wdb}"; exit 1; }
          ls -l "${wdb}"
