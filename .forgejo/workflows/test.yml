#
# Runs the test suite. Same runner requirements as build.yml, and the same
# plain git checkout, because the `vivado` host has no node.
name: Test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '47 4 * * 1'

jobs:
  test:
    runs-on: vivado
    steps:
      - name: Checkout
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PAGER: cat
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
              fetch -q --depth=1 origin "+${REF}:refs/ci/head"
          git checkout -q refs/ci/head
          # --no-pager matters: the runner leaves git free to start a pager,
          # which then waits on input forever and hangs the whole job.
          git --no-pager log --oneline -1

      - name: Run the tests
        run: bazelisk test --test_output=errors //...

      - name: Check that the simulation produced a waveform database
        run: |
          set -euo pipefail
          bazelisk build //hdl/counter:sim
          wdb="$(bazelisk info bazel-bin)/hdl/counter/sim.wdb"
          test -s "${wdb}" || { echo "missing or empty: ${wdb}"; exit 1; }
          ls -l "${wdb}"
