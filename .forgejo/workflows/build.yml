# SPDX-License-Identifier: Apache-2.0
#
# Builds everything, including the Vivado simulation. It needs the `vivado`
# runner: that host holds the AMD installer archive and the shared Vivado
# install cache that MODULE.bazel points at.
#
# The `vivado` label runs jobs directly on the host, and that host has no
# node, so no JavaScript action can run here. That is why the checkout is
# done with plain git rather than with actions/checkout.
name: Build

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Once a week, so a build that only rots on the shelf still gets caught.
    - cron: '17 4 * * 1'

jobs:
  build:
    runs-on: vivado
    steps:
      - name: Checkout
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PAGER: cat
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
              fetch -q --depth=1 origin "+${REF}:refs/ci/head"
          git checkout -q refs/ci/head
          # --no-pager matters: the runner leaves git free to start a pager,
          # which then waits on input forever and hangs the whole job.
          git --no-pager log --oneline -1

      - name: Show the toolchain
        run: |
          set -euo pipefail
          bazelisk --version
          cat .bazelversion

      - name: Build everything
        run: bazelisk build //...
