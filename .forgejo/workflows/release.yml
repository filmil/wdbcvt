# SPDX-License-Identifier: Apache-2.0
#
# Publishes a rolling `nightly` release, here and on the GitHub mirror,
# holding the wdbcvt binary, a reference waveform database, the report
# on the format work, and an archive of the source tree that built
# them. A manual run may instead
# request a release tagged with the UTC build date, which then stays as
# a fixed snapshot while `nightly` keeps rolling. The .wdb is the sample
# every format decoding experiment starts from, so it is worth having a
# stable download for it.
#
# The report is built by pdflatex from the host through
# rules_latex_host, so the `vivado` runner needs a TeX Live with the
# IEEEtran class installed, next to the other host tools.
#
# The artifacts also go to the GitHub mirror's release of the same tag,
# through the REST API with plain curl, because the runner has no node
# and cannot run the release actions written for it. That step needs
# one secret, `GH_RELEASE_TOKEN`: a fine grained token with `Contents:
# read and write` on the mirror and on nothing else. Without it the
# step says so and stops, and the forge release is unaffected.
#
# The Publish step uses the vendored copy of forgejo-release in
# //.forgejo/actions/forgejo-release, not the upstream action. Upstream
# v2.13.4 embeds an actions/cache step whose `if` guard is always true,
# and actions/cache is a node action, which the node-less `vivado` host
# cannot run. The vendored copy drops that step and is bash only. The
# checkout cannot use actions/checkout for the same reason.
name: Release

on:
  workflow_dispatch:
    inputs:
      dated:
        description: >-
          Tag the release with the UTC build date, like 2026-09-04,
          instead of the rolling nightly tag.
        type: boolean
        default: false
  schedule:
    # Monthly, on the first.
    - cron: '0 3 1 * *'

permissions:
  contents: write

jobs:
  release:
    runs-on: vivado
    steps:
      - name: Checkout
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PAGER: cat
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
              fetch -q --depth=1 origin "+${REF}:refs/ci/head"
          git checkout -q refs/ci/head
          # --no-pager matters: the runner leaves git free to start a pager,
          # which then waits on input forever and hangs the whole job.
          git --no-pager log --oneline -1

      - name: Build the release artifacts
        run: |
          bazelisk build -c opt \
              //cmd/wdbcvt //hdl/counter:sim //docs/latex:report

      - name: Gather them
        run: |
          set -euo pipefail
          bin="$(bazelisk info -c opt bazel-bin)"
          rm -rf dist/release
          mkdir -p dist/release
          cp "${bin}/cmd/wdbcvt/wdbcvt_/wdbcvt" dist/release/wdbcvt-linux-amd64
          cp "${bin}/hdl/counter/sim.wdb" dist/release/counter-sim.wdb
          cp "${bin}/hdl/counter/sim.vcd" dist/release/counter-sim.vcd
          # The report on the whole effort, built from //docs/latex.
          cp "${bin}/docs/latex/report.pdf" dist/release/wdbcvt-report.pdf
          chmod +w dist/release/*
          # The exact source that built the artifacts above. git archive
          # takes only tracked files, so dist/ itself stays out.
          git --no-pager archive --format=tar.gz --prefix=wdbcvt/ \
              -o dist/release/wdbcvt-source.tar.gz refs/ci/head
          ls -l dist/release

      - name: Pick the tag
        id: tag
        env:
          DATED: ${{ inputs.dated }}
        run: |
          set -euo pipefail
          # Scheduled runs have no inputs, so DATED is empty there and
          # the tag stays nightly.
          if [ "${DATED}" = "true" ]; then
            tag="$(date -u +%Y-%m-%d)"
          else
            tag="nightly"
          fi
          echo "picked tag ${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish
        uses: ./.forgejo/actions/forgejo-release
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ steps.tag.outputs.tag }}
          release-dir: dist/release
          override: true
          token: ${{ secrets.FORGEJO_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish to the GitHub mirror
        env:
          MIRROR: ${{ vars.GH_MIRROR_REPO }}
          TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo="${MIRROR:-filmil/wdbcvt}"
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::GH_RELEASE_TOKEN is not set; nothing was copied to ${repo}"
            exit 0
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          umask 077

          # api METHOD PATH [json] -> body in ${tmp}/body, status printed.
          api() {
            local method="$1" path="$2" json="${3:-}"
            local args=(-sS -X "${method}"
              -H "Authorization: Bearer ${TOKEN}"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
              -o "${tmp}/body" -w '%{http_code}')
            if [ -n "${json}" ]; then
              args+=(-H "Content-Type: application/json" -d "@${json}")
            fi
            curl "${args[@]}" "https://api.github.com${path}"
          }

          # The mirror carries `main` and nothing else, so a release can
          # only be cut from a commit it already has. mirror.yml runs on
          # every push, and both jobs take the same serial runner, so
          # this is a guard and not a race to wait out.
          code="$(api GET "/repos/${repo}/commits/${SHA}")"
          if [ "${code}" != "200" ]; then
            echo "::warning::${repo} does not carry ${SHA} yet; nothing was uploaded"
            exit 0
          fi

          # `nightly` rolls, and GitHub does not move a tag that already
          # exists, so the release and its tag are removed and made
          # again at this commit. A dated tag is overwritten the same
          # way, which is what `override: true` does on the forge side.
          code="$(api GET "/repos/${repo}/releases/tags/${TAG}")"
          if [ "${code}" = "200" ]; then
            id="$(jq -r '.id' "${tmp}/body")"
            api DELETE "/repos/${repo}/releases/${id}" >/dev/null
            api DELETE "/repos/${repo}/git/refs/tags/${TAG}" >/dev/null
          fi

          jq -n --arg tag "${TAG}" --arg sha "${SHA}" \
                --arg url "${SERVER_URL}/${REPOSITORY}" \
                --argjson pre "$([ "${TAG}" = nightly ] && echo true || echo false)" '
            {
              tag_name: $tag,
              target_commitish: $sha,
              name: $tag,
              prerelease: $pre,
              body: ("Built from `\($sha)` by the release workflow of \($url), "
                     + "which is where this project is developed. This repository "
                     + "is a read-only mirror of its `main` branch.\n\n"
                     + "The format knowledge in `wdbcvt` was worked out by an AI "
                     + "agent running experiments on files Vivado 2025.2 wrote. "
                     + "It is not a specification; see `docs/provenance.md`.")
            }' > "${tmp}/release.json"
          code="$(api POST "/repos/${repo}/releases" "${tmp}/release.json")"
          if [ "${code}" != "201" ]; then
            echo "could not create the release on ${repo}: HTTP ${code}" >&2
            jq -r '.message // empty' "${tmp}/body" >&2 || true
            exit 1
          fi
          id="$(jq -r '.id' "${tmp}/body")"

          for f in dist/release/*; do
            name="$(basename "${f}")"
            code="$(curl -sS -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              -o "${tmp}/body" -w '%{http_code}' \
              "https://uploads.github.com/repos/${repo}/releases/${id}/assets?name=${name}")"
            if [ "${code}" != "201" ]; then
              echo "could not upload ${name}: HTTP ${code}" >&2
              jq -r '.message // empty' "${tmp}/body" >&2 || true
              exit 1
            fi
            echo "uploaded ${name}"
          done
          echo "published ${TAG} to ${repo}"
