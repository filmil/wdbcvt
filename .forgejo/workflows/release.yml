# SPDX-License-Identifier: Apache-2.0
#
# Publishes a rolling `nightly` release holding the wdbcvt binary and a
# reference waveform database. The .wdb is the sample every format decoding
# experiment starts from, so it is worth having a stable download for it.
#
# forgejo-release is a composite action made of bash steps, so it runs on
# the node-less `vivado` host. The checkout still cannot use
# actions/checkout for that same reason.
name: Release

on:
  workflow_dispatch:
  schedule:
    # Monthly, on the first.
    - cron: '0 3 1 * *'

permissions:
  contents: write

jobs:
  release:
    runs-on: vivado
    steps:
      - name: Checkout
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PAGER: cat
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
              fetch -q --depth=1 origin "+${REF}:refs/ci/head"
          git checkout -q refs/ci/head
          # --no-pager matters: the runner leaves git free to start a pager,
          # which then waits on input forever and hangs the whole job.
          git --no-pager log --oneline -1

      - name: Build the release artifacts
        run: bazelisk build -c opt //cmd/wdbcvt //hdl/counter:sim

      - name: Gather them
        run: |
          set -euo pipefail
          bin="$(bazelisk info -c opt bazel-bin)"
          rm -rf dist/release
          mkdir -p dist/release
          cp "${bin}/cmd/wdbcvt/wdbcvt_/wdbcvt" dist/release/wdbcvt-linux-amd64
          cp "${bin}/hdl/counter/sim.wdb" dist/release/counter-sim.wdb
          cp "${bin}/hdl/counter/sim.vcd" dist/release/counter-sim.vcd
          chmod +w dist/release/*
          ls -l dist/release

      - name: Publish
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: nightly
          release-dir: dist/release
          override: true
          token: ${{ secrets.FORGEJO_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
